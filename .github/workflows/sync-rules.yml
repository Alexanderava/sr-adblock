name: Sync rule set

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate rule set from upstream
        run: python3 tools/gen_rules.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/naisi.list
          if git diff --staged --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "chore: sync naisi rule set from upstream"
            git push
            echo "已更新 rules/naisi.list"
          fi
